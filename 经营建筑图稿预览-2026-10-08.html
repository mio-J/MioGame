</style><header><h1>经营建筑 · 概念图与三视图</h1><p>2026-10-08 · 11 组造型提案。点击图片查看原图；主角雕像人物外貌为临时提案。</p><input id="search" placeholder="搜索建筑…" aria-label="搜索建筑"></header><main id="grid"></main><script>
const rows=[{"name":"面包房","description":"compact 3x3m bakery, cream plaster and oak beams, warm terracotta gable roof, chunky bread-shaped hanging sign, brick oven chimney at rear-right, attached front bread display under mustard canvas canopy","concept":"面包房-概念图-v1.png","tri":"面包房-三视图-v1.png"},{"name":"杂货铺","description":"compact 3x3m general store, oak beams and pale stone, moss green roof, striped olive awning, hanging sign with a simple sack and lantern pictogram, permanently attached front shelves of jars and household tools, no loose props","concept":"杂货铺-概念图-v1.png","tri":"杂货铺-三视图-v1.png"},{"name":"酒馆","description":"compact 3x3m tavern, dark oak and cream plaster, deep burgundy steep roof, oversized wooden tankard pictogram sign, arched front door, modest amber glass windows, rear chimney, stout timber silhouette","concept":"酒馆-概念图-v1.png","tri":"酒馆-三视图-v1.png"},{"name":"铁匠铺","description":"compact 3x3m blacksmith shop, pale stone lower walls and dark beams, charcoal slate roof, open front work bay with a fixed anvil workbench, rear forge chimney, attached bellows, hammer pictogram sign, no flames sparks or smoke effects","concept":"铁匠铺-概念图-v1.png","tri":"铁匠铺-三视图-v2.png"},{"name":"药水铺","description":"compact 3x3m potion shop, ivory masonry and oak timber, muted violet tile roof, round glass bottle sign, attached window displays of colored potion bottles, copper ventilation cap on roof, charming civilian shop not a wizard battle tower","concept":"药水铺-概念图-v1.png","tri":"药水铺-三视图-v1.png"},{"name":"集市","description":"4x4m permanent market building, compact timber-framed cruciform canopy pavilion, cream and red striped canvas roofs, central raised canopy with small bell, four fixed counters attached to pavilion supporting posts, produce bins integral to counters, recognizable public market building not scattered standalone stalls","concept":"集市-概念图-v1.png","tri":"集市-三视图-v1.png"},{"name":"旅馆","description":"4x4m welcoming two-story inn, ivory stone ground floor oak upper beams, muted blue slate roof with two dormers, simple hanging bed pictogram sign, central front door under small canopy, repeated upper guestroom windows, attached narrow side balcony, rear chimney, no humans","concept":"旅馆-概念图-v1.png","tri":"旅馆-三视图-v1.png"},{"name":"电器行","description":"3x3m modestly advanced electricity shop in a medieval fantasy town, cream stone and dark timber, blue slate roof copper fittings, roof-mounted small brass insulated power apparatus, front vitrines of lamps and compact dynamos, lightning pictogram sign, no modern glass skyscraper, no VFX","concept":"电器行-概念图-v1.png","tri":"电器行-三视图-v1.png"},{"name":"百货公司","description":"6x6m upscale but restrained three-story department store, broad symmetric ivory stone facade oak and brass trim, blue-gray mansard roof with three dormers, large repeated shop windows on ground and second floors, central double-door entrance, red fabric awnings, merchant crest sign, no text no clock tower, town retail landmark","concept":"百货公司-概念图-v1.png","tri":"百货公司-三视图-v1.png"},{"name":"魔导器专卖店","description":"3x3m refined magic-technology shop, ivory stone oak and brass, teal slate roof, small physically solid cyan crystal set inside brass roof bracket, front display windows with crystal lanterns and mechanical talismans, hanging crystal-and-gear pictogram sign, no particles or magic aura, civilian shop not weapons tower","concept":"魔导器专卖店-概念图-v1.png","tri":"魔导器专卖店-三视图-v1.png"},{"name":"主角雕像","description":"6x6m public monument, modest bronze statue of a thin older male ancestral lord in simple long medieval coat standing thoughtfully with one hand holding a closed book, no weapon no crown, broad readable silhouette not exaggerated muscular hero, restrained brass gold patina, stepped ivory stone structural pedestal with red civic crest plaque, no surrounding plaza no people; character likeness provisional because protagonist has no finalized design","concept":"主角雕像-概念图-v1.png","tri":"主角雕像-三视图-v1.png"}],base="项目文档/设计文档/美术/主城/敌人与建筑设定图/";function render(){const g=document.getElementById("grid");g.replaceChildren();rows.filter(r=>r.name.includes(document.getElementById("search").value.trim())).forEach(r=>{const c=document.createElement("article");const h=document.createElement("h2");h.textContent=r.name;c.append(h);for(const[k,l]of[["concept","概念图"],["tri","三视图"]]){const t=document.createElement("div");t.className="label";t.textContent=l;const a=document.createElement("a");a.className="image "+k;a.href=base+r[k];a.target="_blank";a.rel="noopener";const im=document.createElement("img");im.src=a.href;im.alt=r.name+l;im.loading="lazy";a.append(im);c.append(t,a)}const f=document.createElement("footer");const a=document.createElement("a");a.href="项目文档/设计文档/建筑/经营建筑/"+r.name+".md";a.textContent="查看设计文档";f.append(a);c.append(f);g.append(c)})}document.getElementById("search").addEventListener("input",render);render();
</script></html>
